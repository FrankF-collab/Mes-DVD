<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --surface-2: #f0ede7;
    --text: #24211d;
    --text-muted: #6b6459;
    --border: #e2ddd3;
    --accent: #a8402f;
    --accent-hover: #8f3527;
    --accent-soft: #f4e3de;
    --success: #4a7c59;
    --success-soft: #e4efe6;
    --danger: #a8402f;
    --shadow: 0 1px 3px rgba(30, 25, 15, 0.08), 0 1px 2px rgba(30, 25, 15, 0.06);
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --surface: #262320;
      --surface-2: #2e2b27;
      --text: #f0ece4;
      --text-muted: #a89f92;
      --border: #3a362f;
      --accent: #e0806a;
      --accent-hover: #ec9482;
      --accent-soft: #3a2b26;
      --success: #7fb894;
      --success-soft: #24352a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --surface: #262320;
    --surface-2: #2e2b27;
    --text: #f0ece4;
    --text-muted: #a89f92;
    --border: #3a362f;
    --accent: #e0806a;
    --accent-hover: #ec9482;
    --accent-soft: #3a2b26;
    --success: #7fb894;
    --success-soft: #24352a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 20px 14px 60px;
    line-height: 1.4;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  header .icon {
    font-size: 30px;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 18px;
  }

  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }

  /* --- Recherche --- */
  .search-row {
    display: flex;
    gap: 8px;
  }

  .search-row input {
    flex: 1;
  }

  #searchResult {
    margin-top: 14px;
  }

  .result-empty {
    color: var(--text-muted);
    font-size: 13.5px;
    padding: 10px 2px;
  }

  .result-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .result-title {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 13.5px;
  }

  .result-grid .label {
    color: var(--text-muted);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 1px;
  }

  .result-multi {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-multi .result-card {
    cursor: default;
  }

  /* --- Formulaire --- */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  input[type="text"], input[type="number"], select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14.5px;
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 22px;
  }

  .checkbox-row input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }

  .checkbox-row label { font-size: 14px; color: var(--text); font-weight: 500; }

  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
    font-weight: 600;
    border-radius: 8px;
    font-size: 14px;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 10px 18px;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 14px;
  }

  .btn-full {
    width: 100%;
    padding: 11px;
    margin-top: 14px;
    font-size: 14.5px;
  }

  .btn-small {
    padding: 6px 10px;
    font-size: 12.5px;
  }

  .collapse-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
  }

  .collapse-toggle .chevron {
    color: var(--text-muted);
    font-size: 14px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .collapse-toggle.open .chevron {
    transform: rotate(90deg);
  }

  .collapse-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, margin-top 0.25s ease;
    margin-top: 0;
  }

  .collapse-body.open {
    max-height: 2400px;
    margin-top: 14px;
  }

  .btn-ai {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 9px 12px;
    white-space: nowrap;
  }

  .btn-ai:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .titre-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .titre-row .field { flex: 1; }

  .ai-note {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .ai-status {
    font-size: 12.5px;
    color: var(--accent);
    margin-top: 6px;
    min-height: 16px;
  }

  /* --- Liste --- */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .count-pill {
    background: var(--surface-2);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .filter-row select {
    font-size: 13px;
    padding: 7px 8px;
  }

  .dvd-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }

  .dvd-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dvd-item .info { flex: 1; min-width: 0; }

  .dvd-item .titre {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
    word-break: break-word;
    line-height: 1.25;
  }

  .dvd-item .meta {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .item-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item-actions button { width: 100%; }

  @media (max-width: 420px) {
    .dvd-list { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .badge-prete {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .badge-dispo {
    background: var(--success-soft);
    color: var(--success);
  }

  .dvd-item.flash-highlight {
    animation: flashHighlight 1.6s ease;
  }

  @keyframes flashHighlight {
    0%, 100% { box-shadow: none; border-color: var(--border); }
    20%, 60% { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); border-color: var(--accent); }
  }

  .scanner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .scanner-box {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }

  .scanner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }

  .scanner-close {
    background: var(--surface-2);
    border: none;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }

  #scannerVideo {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    display: block;
    object-fit: cover;
  }

  .scanner-status {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 30px 10px;
    font-size: 14px;
  }

  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

  @media (max-width: 420px) {
    .form-grid { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon">📀</div>
    <div style="flex:1;">
      <h1>Ma collection de DVD</h1>
      <div class="subtitle">Enregistre et retrouve tes DVD en un instant</div>
    </div>
    <button type="button" class="btn-ai" id="installBtn" style="display:none; white-space:nowrap;">⬇️ Installer</button>
  </header>

  <!-- EXPORT / IMPORT -->
  <div class="card" style="padding-top:14px; padding-bottom:10px;">
    <div style="display:flex; gap:8px;">
      <button class="btn-secondary" id="exportBtn" style="flex:1;">⬇️ Exporter en Excel</button>
      <label for="importFileInput" class="btn-secondary" id="importBtn" style="flex:1; display:flex; align-items:center; justify-content:center; cursor:pointer; text-align:center;">⬆️ Importer un Excel</label>
    </div>
    <input type="file" id="importFileInput" accept=".xlsx,.xls" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">
    <div id="exportStatus" style="font-size:12.5px; color: var(--text-muted); margin-top:6px;"></div>
  </div>

  <!-- RECHERCHE -->
  <div class="card">
    <button type="button" class="collapse-toggle" id="searchToggle">
      <h2 style="margin:0;">🔍 Rechercher un DVD</h2>
      <span class="chevron" id="searchChevron">▸</span>
    </button>
    <div class="collapse-body" id="searchBody">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Saisir un titre (ou une partie du titre)…" autocomplete="off">
      <button class="btn-primary" id="searchBtn">Rechercher</button>
      <button class="btn-secondary" id="scanSearchBtn" title="Scanner un code-barre">📷</button>
    </div>
    </div>
    <div id="searchResult"></div>
  </div>

  <!-- FORMULAIRE AJOUT -->
  <div class="card">
    <button type="button" class="collapse-toggle" id="addToggle">
      <h2 style="margin:0;" id="addTitleText">➕ Ajouter un DVD</h2>
      <span class="chevron" id="addChevron">▸</span>
    </button>
    <div class="collapse-body" id="addBody">
    <div class="form-grid">
      <div class="field full">
        <div class="titre-row">
          <div class="field">
            <label for="f-titre">Titre *</label>
            <input type="text" id="f-titre" placeholder="Ex : Le Fabuleux Destin d'Amélie Poulain">
          </div>
          <button type="button" class="btn-ai" id="aiFillBtn">✨ Compléter</button>
        </div>
        <div class="ai-note">L'IA propose durée / année / genre à partir du titre, à vérifier — elle ne consulte pas internet en direct.</div>
        <div class="ai-status" id="aiStatus"></div>
      </div>
      <div class="field">
        <label for="f-duree">Durée (minutes)</label>
        <input type="number" id="f-duree" min="0" placeholder="Ex : 122">
      </div>
      <div class="field">
        <label for="f-annee">Année</label>
        <input type="number" id="f-annee" min="1900" max="2100" placeholder="Ex : 2001">
      </div>
      <div class="field">
        <label for="f-genre">Genre</label>
        <input type="text" id="f-genre" placeholder="Ex : Comédie dramatique">
      </div>
      <div class="field">
        <label for="f-support">Type de support</label>
        <input type="text" id="f-support" list="supportOptions" placeholder="Ex : DVD, Blu-ray, 4K…" autocomplete="off">
        <datalist id="supportOptions"></datalist>
      </div>
      <div class="field">
        <label for="f-edition">Édition</label>
        <input type="text" id="f-edition" list="editionOptions" placeholder="Choisir ou saisir une nouvelle édition" autocomplete="off">
        <datalist id="editionOptions"></datalist>
      </div>
      <div class="field full">
        <label for="f-codebarre">Code-barre</label>
        <div class="titre-row">
          <div class="field">
            <input type="text" id="f-codebarre" placeholder="Ex : 3512345678901" inputmode="numeric">
          </div>
          <button type="button" class="btn-ai" id="scanFormBtn">📷 Scanner</button>
        </div>
      </div>
      <div class="field">
        <label for="f-colonne">Emplacement — Colonne</label>
        <input type="text" id="f-colonne" placeholder="Ex : A">
      </div>
      <div class="field">
        <label for="f-etagere">Emplacement — Étagère</label>
        <input type="text" id="f-etagere" placeholder="Ex : 3">
      </div>
      <div class="checkbox-row full">
        <input type="checkbox" id="f-prete">
        <label for="f-prete">Ce DVD est actuellement prêté</label>
      </div>
      <div class="field full" id="emprunteurField" style="display:none;">
        <label for="f-emprunteur">Prêté à</label>
        <input type="text" id="f-emprunteur" placeholder="Nom de l'emprunteur">
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn-primary" id="addBtn" style="flex:1;">Ajouter à la collection</button>
      <button class="btn-secondary" id="cancelEditBtn" style="display:none;">Annuler</button>
    </div>
    <div id="formMsg" style="font-size:12.5px; color: var(--danger); margin-top:6px;"></div>
    </div>
  </div>

  <!-- LISTE -->
  <div class="card">
    <div class="list-header">
      <h2 style="margin:0;">🎬 Toute la collection</h2>
      <span class="count-pill" id="countPill">0 DVD</span>
    </div>
    <div class="filter-row">
      <select id="sortSelect">
        <option value="titre">Trier par titre</option>
        <option value="annee">Trier par année</option>
        <option value="genre">Trier par genre</option>
      </select>
      <select id="filterPrete">
        <option value="tous">Tous</option>
        <option value="dispo">Disponibles</option>
        <option value="prete">Prêtés</option>
      </select>
    </div>
    <div id="dvdList" class="dvd-list"></div>
  </div>

</div>

<!-- MODALE SCANNER -->
<div id="scannerOverlay" class="scanner-overlay" style="display:none;">
  <div class="scanner-box">
    <div class="scanner-header">
      <span>📷 Scanner un code-barre</span>
      <button type="button" class="scanner-close" id="scannerCloseBtn">✕</button>
    </div>
    <video id="scannerVideo" playsinline muted></video>
    <div class="scanner-status" id="scannerStatus">Initialisation de la caméra…</div>
  </div>
</div>

<!-- MODALE CONFIRMATION -->
<div id="confirmOverlay" class="scanner-overlay" style="display:none;">
  <div class="scanner-box">
    <div class="scanner-header">
      <span>⚠️ Confirmation</span>
    </div>
    <div class="scanner-status" id="confirmMessage" style="padding:16px 14px 4px;"></div>
    <div style="display:flex; gap:8px; padding:14px;">
      <button type="button" class="btn-secondary" id="confirmCancelBtn" style="flex:1;">Annuler</button>
      <button type="button" class="btn-danger-outline" id="confirmOkBtn" style="flex:1;">Supprimer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function() {
  // --- Confirmation personnalisée (remplace confirm() natif, peu fiable en PWA) ---
  let confirmOnOk = null;

  function showConfirm(message, onOk, okLabel) {
    confirmOnOk = onOk;
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmOkBtn').textContent = okLabel || 'Supprimer';
    document.getElementById('confirmOverlay').style.display = 'flex';
  }

  function hideConfirm() {
    document.getElementById('confirmOverlay').style.display = 'none';
    confirmOnOk = null;
  }

  document.getElementById('confirmCancelBtn').addEventListener('click', hideConfirm);
  document.getElementById('confirmOkBtn').addEventListener('click', () => {
    const cb = confirmOnOk;
    hideConfirm();
    if (cb) cb();
  });

  // --- Scanner de code-barre ---
  let scannerStream = null;
  let scannerLoopId = null;
  let scannerOnResult = null;

  function isScannerSupported() {
    return 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  }

  async function openScanner(onResult) {
    scannerOnResult = onResult;
    const overlay = document.getElementById('scannerOverlay');
    const statusEl = document.getElementById('scannerStatus');
    const video = document.getElementById('scannerVideo');
    overlay.style.display = 'flex';

    if (!isScannerSupported()) {
      statusEl.textContent = 'Le scan n\'est pas pris en charge par ce navigateur. Saisis le code manuellement.';
      return;
    }

    statusEl.textContent = 'Initialisation de la caméra…';

    try {
      scannerStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = scannerStream;
      await video.play();
      statusEl.textContent = 'Vise le code-barre du DVD…';

      const detector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39']
      });

      const scanFrame = async () => {
        if (!scannerStream) return;
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length > 0) {
            const value = codes[0].rawValue;
            closeScanner();
            if (scannerOnResult) scannerOnResult(value);
            return;
          }
        } catch (e) { /* frame non exploitable, on continue */ }
        scannerLoopId = requestAnimationFrame(scanFrame);
      };
      scannerLoopId = requestAnimationFrame(scanFrame);

    } catch (err) {
      if (err && err.name === 'NotAllowedError') {
        statusEl.textContent = 'Accès à la caméra refusé. Autorise la caméra puis réessaie.';
      } else if (err && err.name === 'NotFoundError') {
        statusEl.textContent = 'Aucune caméra détectée sur cet appareil.';
      } else {
        statusEl.textContent = 'Impossible d\'accéder à la caméra.';
      }
    }
  }

  function closeScanner() {
    if (scannerLoopId) cancelAnimationFrame(scannerLoopId);
    scannerLoopId = null;
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    document.getElementById('scannerOverlay').style.display = 'none';
  }

  document.getElementById('scannerCloseBtn').addEventListener('click', closeScanner);

  document.getElementById('scanSearchBtn').addEventListener('click', () => {
    openScanner((code) => {
      document.getElementById('searchInput').value = code;
      doSearchByBarcode(code);
    });
  });

  document.getElementById('scanFormBtn').addEventListener('click', () => {
    openScanner((code) => {
      document.getElementById('f-codebarre').value = code;
    });
  });

  function doSearchByBarcode(code) {
    const resultDiv = document.getElementById('searchResult');
    const match = dvds.find(d => (d.codeBarre || '').trim() === code.trim());

    if (match) {
      resultDiv.innerHTML = '<div class="result-card">' + renderDvdCardHtml(match) + '</div>';
      attachResultEditHandlers(resultDiv);
    } else {
      resultDiv.innerHTML =
        '<div class="result-empty">Aucun DVD trouvé pour le code-barre « ' + escapeHtml(code) + ' ».</div>' +
        '<button class="btn-primary btn-full" id="createFromBarcodeBtn">➕ Créer une fiche avec ce code-barre</button>';
      document.getElementById('createFromBarcodeBtn').addEventListener('click', () => {
        prefillNewForm('');
        document.getElementById('f-codebarre').value = code;
      });
    }
    setSearchOpen(false);
  }

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').style.display = 'inline-block';
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('installBtn').style.display = 'none';
  });

  const STORAGE_KEY = 'dvd-collection-v1';
  let dvds = [];

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      dvds = raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Erreur de lecture du stockage', e);
      dvds = [];
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dvds));
    } catch (e) {
      console.error('Erreur de sauvegarde', e);
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function doSearch() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultDiv = document.getElementById('searchResult');

    if (!q) {
      resultDiv.innerHTML = '<div class="result-empty">Saisis un titre puis clique sur « Rechercher ».</div>';
      return;
    }

    const matches = dvds.filter(d => d.titre.toLowerCase().includes(q));

    if (matches.length === 0) {
      const rawTitre = document.getElementById('searchInput').value.trim();
      resultDiv.innerHTML =
        '<div class="result-empty">Aucun DVD trouvé pour « ' + escapeHtml(rawTitre) + ' ».</div>' +
        '<button class="btn-primary btn-full" id="createFromSearchBtn">➕ Créer la fiche « ' + escapeHtml(rawTitre) + ' »</button>';
      document.getElementById('createFromSearchBtn').addEventListener('click', () => prefillNewForm(rawTitre));
    } else if (matches.length === 1) {
      resultDiv.innerHTML = '<div class="result-card">' + renderDvdCardHtml(matches[0]) + '</div>';
      attachResultEditHandlers(resultDiv);
    } else {
      resultDiv.innerHTML = '<div class="result-multi">' +
        matches.map(d => '<div class="result-card">' + renderDvdCardHtml(d) + '</div>').join('') +
        '</div>';
      attachResultEditHandlers(resultDiv);
    }

    setSearchOpen(false);
  }

  function attachResultEditHandlers(container) {
    container.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.getAttribute('data-edit')));
    });
  }

  function renderDvdCardHtml(d) {
    const badge = d.prete
      ? '<span class="badge badge-prete">Prêté</span>'
      : '<span class="badge badge-dispo">Disponible</span>';
    return `
      <div class="result-title">${escapeHtml(d.titre)}</div>
      <div class="result-grid">
        <div><div class="label">Durée</div>${d.duree ? escapeHtml(d.duree) + ' min' : '—'}</div>
        <div><div class="label">Année</div>${d.annee ? escapeHtml(d.annee) : '—'}</div>
        <div><div class="label">Genre</div>${d.genre ? escapeHtml(d.genre) : '—'}</div>
        <div><div class="label">Support</div>${d.support ? escapeHtml(d.support) : '—'}</div>
        <div><div class="label">Édition</div>${d.edition ? escapeHtml(d.edition) : '—'}</div>
        <div><div class="label">Emplacement</div>${(d.colonne || d.etagere) ? 'Col. ' + escapeHtml(d.colonne || '—') + ' / Étag. ' + escapeHtml(d.etagere || '—') : '—'}</div>
      </div>
      ${d.codeBarre ? '<div style="margin-top:6px; font-size:11.5px; color: var(--text-muted);">Code-barre : ' + escapeHtml(d.codeBarre) + '</div>' : ''}
      ${(d.prete && d.emprunteur) ? '<div style="margin-top:4px; font-size:12.5px; color: var(--accent); font-weight:600;">Emprunté par : ' + escapeHtml(d.emprunteur) + '</div>' : ''}
      <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
        ${badge}
        <button class="btn-secondary btn-small" data-edit="${d.id}">Modifier</button>
      </div>
    `;
  }

  let editingId = null;

  function setSearchOpen(open) {
    document.getElementById('searchBody').classList.toggle('open', open);
    document.getElementById('searchToggle').classList.toggle('open', open);
    document.getElementById('searchChevron').textContent = open ? '▾' : '▸';
    if (open) {
      setTimeout(() => document.getElementById('searchInput').focus(), 200);
    }
  }

  document.getElementById('searchToggle').addEventListener('click', () => {
    const isOpen = document.getElementById('searchBody').classList.contains('open');
    setSearchOpen(!isOpen);
  });
  setSearchOpen(false);

  function setAddOpen(open) {
    document.getElementById('addBody').classList.toggle('open', open);
    document.getElementById('addToggle').classList.toggle('open', open);
    document.getElementById('addChevron').textContent = open ? '▾' : '▸';
  }

  document.getElementById('addToggle').addEventListener('click', () => {
    const isOpen = document.getElementById('addBody').classList.contains('open');
    if (isOpen && editingId) { exitEditMode(); }
    setAddOpen(!isOpen);
  });
  setAddOpen(false);

  function updateEmprunteurVisibility() {
    const checked = document.getElementById('f-prete').checked;
    document.getElementById('emprunteurField').style.display = checked ? 'flex' : 'none';
  }
  document.getElementById('f-prete').addEventListener('change', updateEmprunteurVisibility);

  function exitEditMode() {
    editingId = null;
    document.getElementById('addTitleText').textContent = '➕ Ajouter un DVD';
    document.getElementById('addBtn').textContent = 'Ajouter à la collection';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('f-titre').value = '';
    document.getElementById('f-duree').value = '';
    document.getElementById('f-annee').value = '';
    document.getElementById('f-genre').value = '';
    document.getElementById('f-support').value = '';
    document.getElementById('f-edition').value = '';
    document.getElementById('f-codebarre').value = '';
    document.getElementById('f-colonne').value = '';
    document.getElementById('f-etagere').value = '';
    document.getElementById('f-prete').checked = false;
    document.getElementById('f-emprunteur').value = '';
    updateEmprunteurVisibility();
    document.getElementById('formMsg').textContent = '';
    document.getElementById('aiStatus').textContent = '';
  }

  function startEdit(id) {
    const d = dvds.find(x => x.id === id);
    if (!d) return;
    editingId = id;
    document.getElementById('addTitleText').textContent = '✏️ Modifier le DVD';
    document.getElementById('addBtn').textContent = 'Enregistrer les modifications';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('f-titre').value = d.titre || '';
    document.getElementById('f-duree').value = d.duree || '';
    document.getElementById('f-annee').value = d.annee || '';
    document.getElementById('f-genre').value = d.genre || '';
    document.getElementById('f-support').value = d.support || '';
    document.getElementById('f-edition').value = d.edition || '';
    document.getElementById('f-codebarre').value = d.codeBarre || '';
    document.getElementById('f-colonne').value = d.colonne || '';
    document.getElementById('f-etagere').value = d.etagere || '';
    document.getElementById('f-prete').checked = !!d.prete;
    document.getElementById('f-emprunteur').value = d.emprunteur || '';
    updateEmprunteurVisibility();
    setAddOpen(true);
    document.getElementById('addToggle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    exitEditMode();
  });

  function prefillNewForm(titre) {
    if (editingId) exitEditMode();
    setSearchOpen(false);
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResult').innerHTML =
      '<div class="result-empty">Saisis un titre puis clique sur « Rechercher ».</div>';
    setAddOpen(true);
    document.getElementById('f-titre').value = titre;
    document.getElementById('f-support').value = '';
    document.getElementById('f-codebarre').value = '';
    document.getElementById('f-colonne').value = '';
    document.getElementById('f-etagere').value = '';
    document.getElementById('f-emprunteur').value = '';
    updateEmprunteurVisibility();
    document.getElementById('f-titre').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('f-duree').focus();
  }

  function addDvd() {
    const titre = document.getElementById('f-titre').value.trim();
    const duree = document.getElementById('f-duree').value.trim();
    const annee = document.getElementById('f-annee').value.trim();
    const genre = document.getElementById('f-genre').value.trim();
    const support = document.getElementById('f-support').value.trim();
    const edition = document.getElementById('f-edition').value.trim();
    const codeBarre = document.getElementById('f-codebarre').value.trim();
    const colonne = document.getElementById('f-colonne').value.trim();
    const etagere = document.getElementById('f-etagere').value.trim();
    const prete = document.getElementById('f-prete').checked;
    const emprunteur = prete ? document.getElementById('f-emprunteur').value.trim() : '';
    const msg = document.getElementById('formMsg');

    if (!titre) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Le titre est obligatoire.';
      return;
    }

    if (editingId) {
      const d = dvds.find(x => x.id === editingId);
      if (d) {
        d.titre = titre; d.duree = duree; d.annee = annee;
        d.genre = genre; d.support = support; d.edition = edition; d.prete = prete;
        d.codeBarre = codeBarre; d.colonne = colonne; d.etagere = etagere;
        d.emprunteur = emprunteur;
      }
      saveData();
      msg.style.color = 'var(--success)';
      msg.textContent = 'Modifications enregistrées ✓';
      setTimeout(() => { msg.textContent = ''; }, 2500);
      exitEditMode();
      setAddOpen(false);
      renderList();
      return;
    }

    msg.textContent = '';

    dvds.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      titre, duree, annee, genre, support, edition, codeBarre, colonne, etagere, prete, emprunteur
    });
    saveData();

    document.getElementById('f-titre').value = '';
    document.getElementById('f-duree').value = '';
    document.getElementById('f-annee').value = '';
    document.getElementById('f-genre').value = '';
    document.getElementById('f-support').value = '';
    document.getElementById('f-edition').value = '';
    document.getElementById('f-codebarre').value = '';
    document.getElementById('f-colonne').value = '';
    document.getElementById('f-etagere').value = '';
    document.getElementById('f-prete').checked = false;
    document.getElementById('f-emprunteur').value = '';
    updateEmprunteurVisibility();
    document.getElementById('aiStatus').textContent = '';

    msg.style.color = 'var(--success)';
    msg.textContent = 'DVD ajouté à la collection ✓';
    setTimeout(() => { msg.textContent = ''; msg.style.color = 'var(--danger)'; }, 2500);

    setAddOpen(false);
    renderList();
  }

  function togglePret(id) {
    const d = dvds.find(x => x.id === id);
    if (d) {
      d.prete = !d.prete;
      saveData();
      renderList();
    }
  }

  function deleteDvd(id) {
    dvds = dvds.filter(x => x.id !== id);
    saveData();
    renderList();
  }

  function refreshEditionOptions() {
    const datalist = document.getElementById('editionOptions');
    const uniqueEditions = [...new Set(
      dvds.map(d => (d.edition || '').trim()).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    datalist.innerHTML = uniqueEditions.map(e =>
      '<option value="' + escapeHtml(e) + '"></option>'
    ).join('');
  }

  function refreshSupportOptions() {
    const datalist = document.getElementById('supportOptions');
    const uniqueSupports = [...new Set(
      dvds.map(d => (d.support || '').trim()).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    datalist.innerHTML = uniqueSupports.map(s =>
      '<option value="' + escapeHtml(s) + '"></option>'
    ).join('');
  }

  function renderList() {
    refreshEditionOptions();
    refreshSupportOptions();
    const listDiv = document.getElementById('dvdList');
    const countPill = document.getElementById('countPill');
    const sortBy = document.getElementById('sortSelect').value;
    const filterPrete = document.getElementById('filterPrete').value;

    let items = dvds.slice();

    if (filterPrete === 'dispo') items = items.filter(d => !d.prete);
    if (filterPrete === 'prete') items = items.filter(d => d.prete);

    items.sort((a, b) => {
      if (sortBy === 'annee') return (parseInt(a.annee) || 0) - (parseInt(b.annee) || 0);
      if (sortBy === 'genre') return (a.genre || '').localeCompare(b.genre || '');
      return (a.titre || '').localeCompare(b.titre || '');
    });

    countPill.textContent = dvds.length + (dvds.length > 1 ? ' DVD' : ' DVD');

    if (items.length === 0) {
      listDiv.innerHTML = '<div class="empty-state"><div class="icon">📭</div>Aucun DVD à afficher.<br>Ajoute ton premier DVD ci-dessus !</div>';
      return;
    }

    listDiv.innerHTML = items.map(d => {
      const badge = d.prete
        ? '<span class="badge badge-prete">Prêté</span>'
        : '<span class="badge badge-dispo">Disponible</span>';
      const metaParts = [];
      if (d.annee) metaParts.push(escapeHtml(d.annee));
      if (d.duree) metaParts.push(escapeHtml(d.duree) + ' min');
      if (d.genre) metaParts.push(escapeHtml(d.genre));
      if (d.support) metaParts.push(escapeHtml(d.support));
      if (d.edition) metaParts.push(escapeHtml(d.edition));
      if (d.colonne || d.etagere) metaParts.push('📍 Col. ' + escapeHtml(d.colonne || '—') + ' / Étag. ' + escapeHtml(d.etagere || '—'));
      if (d.prete && d.emprunteur) metaParts.push('👤 ' + escapeHtml(d.emprunteur));

      return `
        <div class="dvd-item" id="dvd-card-${d.id}">
          <div class="info">
            <div class="titre">${escapeHtml(d.titre)}</div>
            <div class="meta">${metaParts.join(' · ')}</div>
            <div style="margin-top:6px;">${badge}</div>
          </div>
          <div class="item-actions">
            <button class="btn-secondary btn-small" data-edit="${d.id}">Modifier</button>
            <button class="btn-secondary btn-small" data-toggle="${d.id}">${d.prete ? 'Rendu' : 'Prêté'}</button>
            <button class="btn-danger-outline btn-small" data-delete="${d.id}">Supprimer</button>
          </div>
        </div>
      `;
    }).join('');

    listDiv.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.getAttribute('data-edit')));
    });
    listDiv.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => togglePret(btn.getAttribute('data-toggle')));
    });
    listDiv.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        showConfirm('Supprimer ce DVD de la collection ?', () => {
          deleteDvd(btn.getAttribute('data-delete'));
        });
      });
    });
  }

  let downloadsFn = null;
  (async function initDownloads() {
    try {
      downloadsFn = await claude.use('downloads');
    } catch (e) {
      downloadsFn = null;
    }
  })();

  async function exportToExcel() {
    const statusEl = document.getElementById('exportStatus');

    if (dvds.length === 0) {
      statusEl.textContent = 'Aucun DVD à exporter.';
      return;
    }
    if (typeof XLSX === 'undefined') {
      statusEl.textContent = 'La librairie Excel n\'a pas pu se charger.';
      return;
    }

    statusEl.textContent = 'Préparation du fichier…';

    try {
      const rows = dvds.map(d => ({
        'Titre': d.titre || '',
        'Durée (min)': d.duree || '',
        'Année': d.annee || '',
        'Genre': d.genre || '',
        'Support': d.support || '',
        'Édition': d.edition || '',
        'Code-barre': d.codeBarre || '',
        'Colonne': d.colonne || '',
        'Étagère': d.etagere || '',
        'Prêté': d.prete ? 'Oui' : 'Non',
        'Emprunteur': d.emprunteur || ''
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{ wch: 32 }, { wch: 12 }, { wch: 8 }, { wch: 20 }, { wch: 12 }, { wch: 20 }, { wch: 16 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 18 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'DVD');

      const arrayBuf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([arrayBuf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

      const now = new Date();
      const datePart = now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0');
      const filename = 'ma-collection-dvd-' + datePart + '.xlsx';

      if (downloadsFn) {
        const result = await downloadsFn.save({ filename, data: blob });
        statusEl.textContent = result.status === 'saved' ? 'Fichier Excel enregistré ✓' : 'Fichier envoyé ✓';
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        statusEl.textContent = 'Fichier Excel téléchargé ✓';
      }
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') statusEl.textContent = 'Téléchargement annulé.';
      else if (code === 'rate_limited') statusEl.textContent = 'Réessaie dans un instant.';
      else statusEl.textContent = 'Impossible de générer le fichier Excel.';
    }
  }

  document.getElementById('exportBtn').addEventListener('click', exportToExcel);

  document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    showConfirm(
      'Importer ce fichier va remplacer toute la collection actuelle (pour éviter les doublons). Continuer ?',
      () => importFromExcel(file),
      'Importer'
    );
  });

  function normKey(k) {
    return String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  function importFromExcel(file) {
    const statusEl = document.getElementById('exportStatus');

    if (typeof XLSX === 'undefined') {
      statusEl.textContent = 'La librairie Excel n\'a pas pu se charger.';
      return;
    }

    statusEl.textContent = 'Import en cours…';

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

        const newDvds = [];
        let added = 0;
        rows.forEach(row => {
          const map = {};
          Object.keys(row).forEach(k => { map[normKey(k)] = row[k]; });

          const titre = String(map['titre'] || '').trim();
          if (!titre) return;

          const preteRaw = String(map['prete'] || '').trim().toLowerCase();
          const prete = preteRaw === 'oui' || preteRaw === 'yes' || preteRaw === 'true' || preteRaw === '1';

          newDvds.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + added,
            titre,
            duree: String(map['duree (min)'] || map['duree'] || '').trim(),
            annee: String(map['annee'] || '').trim(),
            genre: String(map['genre'] || '').trim(),
            support: String(map['support'] || '').trim(),
            edition: String(map['edition'] || '').trim(),
            codeBarre: String(map['code-barre'] || map['code barre'] || '').trim(),
            colonne: String(map['colonne'] || '').trim(),
            etagere: String(map['etagere'] || '').trim(),
            prete,
            emprunteur: String(map['emprunteur'] || '').trim()
          });
          added++;
        });

        if (added > 0) {
          dvds = newDvds;
          saveData();
          renderList();
          statusEl.textContent = added + ' DVD importé(s) — collection remplacée ✓';
        } else {
          statusEl.textContent = 'Aucune ligne valide trouvée (colonne « Titre » manquante ?). Collection inchangée.';
        }
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      } catch (err) {
        statusEl.textContent = 'Impossible de lire ce fichier Excel.';
      }
    };
    reader.onerror = () => {
      statusEl.textContent = 'Impossible de lire ce fichier.';
    };
    reader.readAsArrayBuffer(file);
  }

  let sampleFn = null;
  (async function initSample() {
    try {
      sampleFn = await claude.use('sample');
    } catch (e) {
      sampleFn = null;
    }
    if (!sampleFn) {
      document.getElementById('aiFillBtn').style.display = 'none';
      document.querySelector('.ai-note').style.display = 'none';
    }
  })();

  async function aiFillFields() {
    const titre = document.getElementById('f-titre').value.trim();
    const statusEl = document.getElementById('aiStatus');
    const btn = document.getElementById('aiFillBtn');

    if (!titre) {
      statusEl.textContent = 'Saisis d\'abord un titre.';
      return;
    }
    if (!sampleFn) {
      statusEl.textContent = 'Fonction IA indisponible ici.';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = 'Recherche des informations…';

    const prompt = 'Tu connais les films et séries sortis en DVD. ' +
      'Pour le titre suivant, réponds UNIQUEMENT avec un objet JSON strict, sans texte autour, ' +
      'au format exact {"duree": <minutes ou null>, "annee": <année de sortie ou null>, "genre": <chaîne courte ou null>, "edition": <chaîne courte ou null>}. ' +
      'Si tu ne connais pas le film ou n\'es pas sûr, mets null sur les champs incertains plutôt que d\'inventer. ' +
      'Titre : ' + titre;

    try {
      const data = await sampleFn.json(prompt, { modelTier: 'quick' });
      if (data.duree) document.getElementById('f-duree').value = data.duree;
      if (data.annee) document.getElementById('f-annee').value = data.annee;
      if (data.genre) document.getElementById('f-genre').value = data.genre;
      if (data.edition) document.getElementById('f-edition').value = data.edition;
      statusEl.textContent = 'Champs suggérés — vérifie avant d\'enregistrer.';
    } catch (e) {
      if (e.code === 'not_granted') {
        statusEl.textContent = 'Autorisation refusée pour utiliser l\'IA ici.';
      } else if (e.code === 'rate_limited') {
        statusEl.textContent = 'Trop de demandes, réessaie dans un instant.';
      } else if (e.code === 'invalid_json' || e.code === 'empty_completion') {
        statusEl.textContent = 'Film non reconnu, complète manuellement.';
      } else {
        statusEl.textContent = 'Impossible de récupérer les infos pour l\'instant.';
      }
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('aiFillBtn').addEventListener('click', aiFillFields);
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
  document.getElementById('addBtn').addEventListener('click', addDvd);
  document.getElementById('sortSelect').addEventListener('change', renderList);
  document.getElementById('filterPrete').addEventListener('change', renderList);

  loadData();
  renderList();
  document.getElementById('searchResult').innerHTML = '<div class="result-empty">Saisis un titre puis clique sur « Rechercher ».</div>';
})();
</script>
</body>
</html>
